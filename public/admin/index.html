<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Blog beheer | Mijn Teamkompas</title>
  </head>
  <body>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'BozidarVukovic/het-teamkompas',
            branch: 'main',
            base_url: 'https://www.mijnteamkompas.nl',
            auth_endpoint: 'api/auth',
          },
          locale: 'nl',
          media_folder: 'public/blog/images',
          public_folder: '/blog/images',
          collections: [
            {
              name: 'blog',
              label: 'Blogartikel',
              label_singular: 'Artikel',
              folder: 'src/content/blog',
              create: true,
              slug: '{{slug}}',
              fields: [
                { label: 'Titel', name: 'title', widget: 'string' },
                {
                  label: 'Publicatiedatum',
                  name: 'date',
                  widget: 'datetime',
                  format: 'YYYY-MM-DD',
                  date_format: 'DD-MM-YYYY',
                  time_format: false,
                },
                {
                  label: 'Samenvatting',
                  name: 'description',
                  widget: 'text',
                  hint: 'Korte beschrijving voor Google (max 160 tekens)',
                },
                { label: 'Afbeelding', name: 'image', widget: 'image', required: false },
                { label: 'Inhoud', name: 'body', widget: 'markdown' },
              ],
            },
          ],
        },
      });
    </script>
  </body>
</html>
